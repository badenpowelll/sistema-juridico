# EJMF — ambiente local completo: banco, API, worker e interface.
# Uso: cp .env.example .env && docker compose up --build
name: ejmf

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ejmf_db
      POSTGRES_USER: ${POSTGRES_USER:-ejmf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      TZ: America/Fortaleza
    volumes:
      - dados_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ejmf} -d ejmf_db"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${EJMF_DB_PORTA:-5432}:5432"

  api:
    build: ./backend
    env_file: .env
    environment:
      EJMF_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ejmf}:${POSTGRES_PASSWORD}@db:5432/ejmf_db
    volumes:
      - arquivos:/app/dados/arquivos  # documentos enviados: a API grava e o worker lê (OCR)
      - copias:/app/dados/backups     # cópias cifradas (o worker grava; em produção, use outro disco)
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/saude')"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      EJMF_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ejmf}:${POSTGRES_PASSWORD}@db:5432/ejmf_db
    volumes:
      - arquivos:/app/dados/arquivos
      - copias:/app/dados/backups
    depends_on:
      api:
        condition: service_healthy

  # Antivírus opcional (Fase 11): `docker compose --profile antivirus up` e EJMF_CLAMAV_ENDERECO=tcp://clamav:3310.
  # A imagem oficial baixa as assinaturas sozinha (freshclam) e precisa de uns 3 GB de memória.
  clamav:
    image: clamav/clamav:stable
    profiles: ["antivirus"]
    volumes:
      - assinaturas_clamav:/var/lib/clamav

  web:
    build:
      context: ./frontend
      args:
        EJMF_API_INTERNA: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  dados_db:
  arquivos:
  copias:
  assinaturas_clamav:
