[project]
name = "ejmf-backend"
version = "0.1.0"
description = "API do Escritório Jurídico Márcio Fernandes (EJMF)"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.165.0",
  "uvicorn[standard]==0.54.0",
  "SQLAlchemy==2.1.9",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.9",
  "argon2-cffi==25.1.0",
  "pyotp==2.12.1",
  "pydantic-settings==2.16.3",
  "email-validator==2.4.0",
  "cryptography>=46",
  "openpyxl==3.1.5",
  "python-multipart==0.0.34",
  "httpx==0.28.1",
  "python-docx==1.2.0",
  "pypdf==7.1.1",
  "nh3==0.3.8",
  "pgvector==0.4.1",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
